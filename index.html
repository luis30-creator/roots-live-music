<div class="container">
<div class="logo"></div>
<h1>ROOTS LIVE MUSIC</h1>
<div class="subtitle">Live Music</div>
<a class="instagram-btn" href="https://www.instagram.com/rootslivemusic/" target="_blank">
<img class="insta-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
<span>Instagram</span></a>
<div class="grid">
<button onclick="guardarContacto()" class="btn save">Guardar contacto</button>
<a href="tel:+34634330058" class="btn call">Llamar</a>
<a href="https://wa.me/34634330058" class="btn whatsapp">WhatsApp</a>
<button onclick="copiarEnlace()" class="btn copy">Copiar enlace</button>
</div>
<div class="qr-text">Escanea para contacto</div>
<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://www.instagram.com/rootslivemusic/"></div>
</div>
<div id="toast" class="toast">Copiado</div>
<script>
function guardarContacto(){
const v='BEGIN:VCARD\nVERSION:3.0\nFN:ROOTS LIVE MUSIC\nTEL:+34634330058\nEND:VCARD';
const b=new Blob([v],{type:'text/vcard'});
const a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='roots_live_music.vcf';
a.click();
}
function copiarEnlace(){
navigator.clipboard.writeText(window.location.href);
const t=document.getElementById('toast');
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
